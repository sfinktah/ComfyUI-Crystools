<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Replication</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            gap: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            color: #00ff00;
            font-family: monospace;
        }
        input[type="range"] {
            width: 150px;
        }
        input[type="number"] {
            width: 60px;
            background: #222;
            border: 1px solid #444;
            color: #00ff00;
            padding: 2px;
        }
    </style>
</head>
<body>
<div class="controls">
    <label>Value: <input type="range" id="valueSlider" min="0" max="100" value="100"></label>
    <label>Start Angle: <input type="number" id="startAngle" value="135" min="-360" max="360"></label>
    <label>Hue: <input type="range" id="hueSlider" min="0" max="360" value="120"></label>
</div>

<svg width="300" height="300" viewBox="0 0 300 300">
    <!-- Matte bezel with dark grey-green tint -->
    <circle cx="150" cy="150" r="152" fill="#050805"></circle>
    <circle cx="150" cy="150" r="150" fill="#0c120c"></circle>
    <circle cx="150" cy="150" r="133" fill="none" stroke="#1a2a1a" stroke-width="1"></circle>
    <circle cx="150" cy="150" r="132" fill="none" stroke="#3a4a3a" stroke-width="1"></circle>
    <circle cx="150" cy="150" r="130" fill="#060906" stroke="none" stroke-width="0" class=""></circle>

    <!-- Glow ring background -->
    <circle cx="150" cy="150" r="90" fill="#020402" class=""></circle>
    <circle cx="150" cy="150" r="88" fill="#000000" class=""></circle>

    <!-- Glow effect -->
    <defs>
        <filter id="glow">
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00ff00" flood-opacity="0.5"></feDropShadow>
        </filter>

        <filter id="segment-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00ff00"></feDropShadow>
        </filter>

        <filter id="segment-glow-amber" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffaa00"></feDropShadow>
        </filter>

        <filter id="segment-glow-red" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff0000"></feDropShadow>
        </filter>
    </defs>

    <!-- Segments -->
    <g id="segments" transform="translate(150,150)">
    </g>

    <!-- Inner dome -->
    <radialGradient id="dome" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00ff00" stop-opacity="0.075"></stop>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.111145"></stop>
    </radialGradient>
    <circle cx="150" cy="150" r="77" fill="#00000088"></circle>
    <circle cx="150" cy="150" r="76" fill="url(#dome)"></circle>

    <!-- Center text -->
    <text id="centerText" x="150" y="150" font-size="42" font-weight="300" text-anchor="middle" fill="#00ff00aa" style="
        font-family: 'HD44780 5x8';
        dominant-baseline: middle;
        text-anchor: middle;
        alignment-baseline: mathematical;
    ">100%</text>

</svg>
<script>
    // Configuration constants
    const numSegments = 30;
    const segmentPadding = 2;
    const pearShapedRatio = 1.0;

    // Dynamic settings
    let currentValue = 100; // Percentage (0-100)
    let startAngleDegrees = 135; // Starting angle in degrees (0 = right, -90 = top)
    let baseHue = 120; // Base hue (0-360, 120 = green)

    // Color transition settings
    const enableColorTransition = true;
    const amberThreshold = 6; // Last 6 segments on the gauge turn amber
    const redThreshold = 2; // Last 2 segments on the gauge turn red

    const svgNS = "http://www.w3.org/2000/svg";
    const segmentGroup = document.getElementById("segments");
    const centerText = document.getElementById("centerText");

    // Core geometry
    const innerRadius = 98;
    const outerRadius = 122;
    const innerWidth = segmentPadding;
    const outerWidth = segmentPadding * pearShapedRatio;

    // Cache for segment elements
    let segmentElements = [];

    // Helper function to convert HSL to hex
    function hslToHex(h, s, l) {
        l /= 100;
        const a = s * Math.min(l, 1 - l) / 100;
        const f = n => {
            const k = (n + h / 30) % 12;
            const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `#${f(0)}${f(8)}${f(4)}`;
    }

    // Get color for a segment based on its position on the gauge
    function getSegmentColor(segmentIndex, isFilled) {
        if (!enableColorTransition) {
            return hslToHex(baseHue, 100, isFilled ? 50 : 20);
        }

        let hue, lightness;
        
        if (segmentIndex >= numSegments - redThreshold) {
            // Last 2 segments (28, 29) are red
            hue = 0; // Pure red
            lightness = isFilled ? 50 : 30; // Higher lightness for dim red to distinguish from amber
        } else if (segmentIndex >= numSegments - amberThreshold) {
            // Segments 24-27 are amber
            hue = 45; // Amber
            lightness = isFilled ? 50 : 20;
        } else {
            // All other segments use base hue
            hue = baseHue;
            lightness = isFilled ? 50 : 20;
        }
        
        return hslToHex(hue, 100, lightness);
    }

    // Get appropriate glow filter for a segment
    function getGlowFilter(segmentIndex) {
        if (!enableColorTransition) {
            return "url(#segment-glow)";
        }

        if (segmentIndex >= numSegments - redThreshold) {
            return "url(#segment-glow-red)";
        } else if (segmentIndex >= numSegments - amberThreshold) {
            return "url(#segment-glow-amber)";
        } else {
            return "url(#segment-glow)";
        }
    }

    // Update filter colors based on current hue
    function updateFilterColors() {
        const baseColor = hslToHex(baseHue, 100, 50);
        document.querySelector('#segment-glow feDropShadow').setAttribute('flood-color', baseColor);

        // Update dome gradient
        const domeGradient = document.getElementById('dome');
        domeGradient.querySelector('stop[offset="0%"]').setAttribute('stop-color', baseColor);

        // Update center text color
        centerText.setAttribute('fill', baseColor + 'aa');
    }

    // Create all segments once - only called on initialization or angle change
    function createSegments() {
        // Clear existing segments
        segmentGroup.innerHTML = '';
        segmentElements = [];

        for (let i = 0; i < numSegments; i++) {
            const angle = (i * 360) / numSegments + startAngleDegrees;
            const aRad = (angle * Math.PI) / 180;

            // Angular width of segment
            const segAngle = (360 / numSegments) * Math.PI / 180;
            const halfAngle = segAngle / 2;

            // Arc endpoints
            const theta0 = aRad - halfAngle;
            const theta1 = aRad + halfAngle;

            // Inner arc points
            const x0 = Math.cos(theta0) * innerRadius;
            const y0 = Math.sin(theta0) * innerRadius;
            const x1 = Math.cos(theta1) * innerRadius;
            const y1 = Math.sin(theta1) * innerRadius;

            // Outer arc points
            const x2 = Math.cos(theta1) * outerRadius;
            const y2 = Math.sin(theta1) * outerRadius;
            const x3 = Math.cos(theta0) * outerRadius;
            const y3 = Math.sin(theta0) * outerRadius;

            // Offset points outward by half width
            const ix0 = x0 - Math.sin(theta0) * (innerWidth / 2);
            const iy0 = y0 + Math.cos(theta0) * (innerWidth / 2);
            const ix1 = x1 + Math.sin(theta1) * (innerWidth / 2);
            const iy1 = y1 - Math.cos(theta1) * (innerWidth / 2);
            const ox2 = x2 + Math.sin(theta1) * (outerWidth / 2);
            const oy2 = y2 - Math.cos(theta1) * (outerWidth / 2);
            const ox3 = x3 - Math.sin(theta0) * (outerWidth / 2);
            const oy3 = y3 + Math.cos(theta0) * (outerWidth / 2);

            // SVG path
            const pathData = [
                `M ${ix0.toFixed(2)} ${iy0.toFixed(2)}`,
                `A ${innerRadius} ${innerRadius} 0 0 1 ${ix1.toFixed(2)} ${iy1.toFixed(2)}`,
                `L ${ox2.toFixed(2)} ${oy2.toFixed(2)}`,
                `A ${outerRadius} ${outerRadius} 0 0 0 ${ox3.toFixed(2)} ${oy3.toFixed(2)}`,
                "Z"
            ].join(" ");

            const g = document.createElementNS(svgNS, "g");
            const path = document.createElementNS(svgNS, "path");

            path.setAttribute("d", pathData);
            path.setAttribute("stroke", "none");

            g.appendChild(path);
            segmentGroup.appendChild(g);

            // Cache the element for efficient updates
            segmentElements[i] = path;
        }
    }

    // Update only the properties of existing segments - called on value/hue changes
    function updateSegments() {
        const filledSegments = Math.round(numSegments * (currentValue / 100));

        for (let i = 0; i < numSegments; i++) {
            const isFilled = i < filledSegments;
            const path = segmentElements[i];

            // Update fill color
            path.setAttribute("fill", getSegmentColor(i, isFilled));
            path.setAttribute("fill-opacity", isFilled ? "0.7" : "0.08");

            // Update filter
            if (isFilled) {
                path.setAttribute("filter", getGlowFilter(i));
            } else {
                path.removeAttribute("filter");
            }
        }
    }

    function renderGauge() {
        // Update center text
        centerText.textContent = Math.round(currentValue) + '%';

        // Update filter colors
        updateFilterColors();

        // Update segments (efficient)
        updateSegments();
    }

    function renderGaugeComplete() {
        // Update center text
        centerText.textContent = Math.round(currentValue) + '%';

        // Update filter colors
        updateFilterColors();

        // Recreate segments (when angle changes)
        createSegments();
        updateSegments();
    }

    // Event listeners for controls
    document.getElementById('valueSlider').addEventListener('input', (e) => {
        currentValue = parseFloat(e.target.value);
        renderGauge(); // Fast update
    });

    document.getElementById('startAngle').addEventListener('input', (e) => {
        startAngleDegrees = parseFloat(e.target.value);
        renderGaugeComplete(); // Full rebuild
    });

    document.getElementById('hueSlider').addEventListener('input', (e) => {
        baseHue = parseFloat(e.target.value);
        renderGauge(); // Fast update
    });

    // Initial render
    renderGaugeComplete();

    // Optional: Animate the gauge
    function animateGauge() {
        const targetValue = Math.random() * 100;
        const startValue = currentValue;
        const duration = 1000;
        const startTime = Date.now();

        function animate() {
            const elapsed = Date.now() - startTime;
            const progress = Math.min(elapsed / duration, 1);

            // Smooth easing
            const eased = 1 - Math.pow(1 - progress, 3);
            currentValue = startValue + (targetValue - startValue) * eased;

            document.getElementById('valueSlider').value = currentValue;
            renderGauge(); // Fast update during animation

            if (progress < 1) {
                requestAnimationFrame(animate);
            }
        }

        animate();
    }

    // Uncomment the line below to enable random animation every 3 seconds
    // setInterval(animateGauge, 3000);
</script>
</body>
</html>
